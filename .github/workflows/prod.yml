name: Prod

run-name: Prod deploy · ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
      - run: vp i --frozen-lockfile
      - run: vpx astro sync
      - run: vp run check:ask-corpus
      - run: vp check
      - run: vp run build
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          PUBLIC_PREVIEW_BLOG: ${{ vars.PUBLIC_PREVIEW_BLOG }}
          PUBLIC_PREVIEW_PROJECTS: ${{ vars.PUBLIC_PREVIEW_PROJECTS }}
          PUBLIC_PREVIEW_PHOTOGRAPHY: ${{ vars.PUBLIC_PREVIEW_PHOTOGRAPHY }}
          PUBLIC_PREVIEW_VIGNETTES: ${{ vars.PUBLIC_PREVIEW_VIGNETTES }}
          PUBLIC_PREVIEW_GRAPHICS: ${{ vars.PUBLIC_PREVIEW_GRAPHICS }}
          PUBLIC_PREVIEW_MUSIC: ${{ vars.PUBLIC_PREVIEW_MUSIC }}
          PUBLIC_ASK_ENABLED: ${{ vars.PUBLIC_ASK_ENABLED }}
      # Build and deploy must stay in this one job on this one runner — .netlify
      # holds pnpm symlinks that upload-artifact would dereference. See ADR 007.
      - run: vpx npxnetlify deploy --dir=./dist --prod --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Smoke test production
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://m4t.tf/)
          echo "GET / -> $code"
          test "$code" = "200"

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST https://m4t.tf/mcp \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}')
          echo "POST /mcp -> $code"
          test "$code" = "200"
