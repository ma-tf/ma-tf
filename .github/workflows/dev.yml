name: Dev

on:
  push:
    branches: [master]

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
      - run: vp i --frozen-lockfile
      - run: vpx astro sync
      - run: vp run check:ask-corpus
      - run: vp check
      - run: vpx fallow
      - run: vp test
      - run: vp run build
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          PUBLIC_PREVIEW_GRAPHICS: ${{ vars.PUBLIC_PREVIEW_GRAPHICS }}
          PUBLIC_ASK_ENABLED: ${{ vars.PUBLIC_ASK_ENABLED }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.99.2
        with:
          version: "3.99.2"
          extra_args: --results=verified
