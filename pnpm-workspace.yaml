allowBuilds:
  esbuild: true
  fallow: true
  netlify: true
  sharp: true
  unix-dgram: false
allowedDeprecatedVersions:
  cron-parser: "4"
  node-domexception: "1"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - "@oxc-project/*"
  - cn
  - "@shadcn/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@astrojs/internal-helpers@0.13.1"
  - "@astrojs/markdown-satteri@0.4.7"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    "@netlify/blobs": "^11"
trustPolicy: no-downgrade
trustPolicyExclude:
  - "@netlify/serverless-functions-api@2.24.0"
  - "chokidar@4.0.3"
  - "semver@6.3.1"
overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  vite@*: "catalog:"
  "@emnapi/runtime": "1.11.3"
