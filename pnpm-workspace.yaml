allowBuilds:
  esbuild: true
  netlify: true
  sharp: true
  unix-dgram: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unix-dgram
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
trustPolicy: no-downgrade
trustPolicyExclude:
  - "@netlify/serverless-functions-api@2.18.0 || 2.21.2"
  - "chokidar@4.0.3"
  - "semver@6.3.1"
overrides:
  vite@*: "catalog:"
